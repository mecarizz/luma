name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Set version from release tag
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use the vMAJOR.MINOR.PATCH format."
          }
          $version = $Matches[1]
          $content = '"""Application version used for release update checks."""' + "`n`nVERSION = `"$version`"`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "core\version.py"),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )
        shell: pwsh

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm Luma.spec

      - name: Package release
        run: |
          Compress-Archive -Path .\dist\Luma.exe -DestinationPath .\dist\Luma-windows-x64.zip
          $hash = (Get-FileHash .\dist\Luma-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Luma-windows-x64.zip" | Set-Content .\dist\Luma-windows-x64.zip.sha256 -Encoding ascii
        shell: pwsh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Luma-windows-x64.zip
            dist/Luma-windows-x64.zip.sha256
